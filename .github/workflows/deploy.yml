name: Firstapp-exp CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      # Step 3: Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4: Build, Tag, and Push Docker Image
      - name: Build, Tag, and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'firstapp-exp-repo' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Convert ECR repository name strictly to lowercase for Docker compliance
          CLEAN_REPO=$(echo "$ECR_REPOSITORY" | tr '[:upper:]' '[:lower:]')

          docker build \
            -t "$ECR_REGISTRY/$CLEAN_REPO:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$CLEAN_REPO:latest" \
            app/

          docker push "$ECR_REGISTRY/$CLEAN_REPO:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$CLEAN_REPO:latest"

      # Step 5: Configure kubectl for AWS EKS
      - name: Update Kubeconfig
        env:
          CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          TARGET_CLUSTER="${CLUSTER_NAME:-Firstapp-exp-eks}"
          TARGET_REGION="${AWS_REGION:-us-east-1}"

          aws eks update-kubeconfig --name "$TARGET_CLUSTER" --region "$TARGET_REGION"

      # Step 6: Deploy manifests to EKS cluster
      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml