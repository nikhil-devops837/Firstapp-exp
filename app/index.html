<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firstapp-exp | Enterprise Expense Tracker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.75rem;
            color: #ffffff;
            font-weight: 700;
        }

        .badge {
            background-color: #10b981;
            color: #064e3b;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 9999px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .item {
            background-color: #0f172a;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-title {
            font-weight: 500;
            color: #e2e8f0;
        }

        .item-sub {
            font-size: 0.8rem;
            color: #64748b;
        }

        .amount {
            font-size: 1.1rem;
            font-weight: 600;
            color: #38bdf8;
        }

        .status-bar {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .status-online {
            color: #34d399;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>Firstapp-exp</h1>
            <span class="badge">Live v1.0</span>
        </div>
        <p class="subtitle">Enterprise Expense Tracker Service</p>

        <div class="item">
            <div>
                <div class="item-title">AWS Cloud Hosting</div>
                <div class="item-sub">Infrastructure</div>
            </div>
            <div class="amount">$140.00</div>
        </div>

        <div class="item">
            <div>
                <div class="item-title">CI/CD Pipeline Runners</div>
                <div class="item-sub">DevOps Automation</div>
            </div>
            <div class="amount">$60.00</div>
        </div>

        <div class="status-bar">
            <span>Status: <span class="status-online">Healthy (200 OK)</span></span>
            <span>Cluster: AWS EKS</span>
        </div>
    </div>

</body>
</html>
